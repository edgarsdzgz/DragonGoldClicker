<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elder Pyreth</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Nunito:wght@700;800;900&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07050c}
a{color:#f0c060}a:hover{color:#ffd97a}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.ol{text-shadow:2px 0 #12090f,-2px 0 #12090f,0 2px #12090f,0 -2px #12090f,2px 2px #12090f,-2px 2px #12090f,2px -2px #12090f,-2px -2px #12090f}
.ol1{text-shadow:1px 0 #12090f,-1px 0 #12090f,0 1px #12090f,0 -1px #12090f,1px 1px #12090f}
.step{clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px)}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes flicker{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #07050c; font-family: 'Nunito', system-ui, sans-serif; color: #f5ecd8;">
  <img class="px" src="images/mock_assets_warfront-bg.png" alt="" style="position: absolute; left: 0; top: 0; width: 390px; height: 846px;">
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(7,5,12,0.45), rgba(7,5,12,0.88) 70%);"></div>

  <!-- chapter card -->
  <header style="position: absolute; left: 0; right: 0; top: 110px; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: fadeUp .8s ease-out;">
    <span style="font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 14px; letter-spacing: 6px; color: #f0c060;">CHAPTER II</span>
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 10px;">
      <span style="width: 70px; height: 2px; background: linear-gradient(90deg, transparent, #f0c060);"></span>
      <span style="width: 10px; height: 10px; background: #ff9a3c; transform: rotate(45deg); box-shadow: 0 0 10px #ff9a3c; animation: flicker 1.8s infinite;"></span>
      <span style="width: 70px; height: 2px; background: linear-gradient(90deg, #f0c060, transparent);"></span>
    </div>
    <h1 class="ol" style="margin: 0; font-family: 'Cinzel', serif; font-weight: 900; font-size: 34px; line-height: 1.1; color: #ffd97a; text-align: center;">A City,<br>Not a Wall</h1>
  </header>

  <!-- dialogue panel; the bust breaks its top edge -->
  <section aria-label="Elder Pyreth speaks" style="position: absolute; left: 12px; right: 12px; bottom: 28px;">
    <img class="px" src="images/mock_heroes_bust-pyreth2.png" alt="Elder Pyreth, an elder dragon with his ember staff" style="position: absolute; left: 2px; top: -158px; width: 184px; height: 192px; z-index: 2;">
    <div class="step" style="background: #12090f; padding: 3px;">
      <div class="step" style="background: linear-gradient(#2e2634, #1c1622); box-shadow: inset 0 3px 0 #574a63; padding: 46px 18px 18px;">
        <p style="margin: 0; font-weight: 800; font-size: 17px; line-height: 1.5; color: #f5ecd8;">Draconia was a city once, Warden, not only a wall. Let us begin to rebuild it.</p>
        <p style="margin: 10px 0 0; font-weight: 800; font-size: 17px; line-height: 1.5; color: #f5ecd8;"><span style="color: #ffd97a;">Captain Rodain's</span> soldiers need a garrison. Start there.</p>
        <div style="display: flex; align-items: center; margin-top: 18px; gap: 12px;">
          <div aria-label="Line 2 of 2" style="display: flex; gap: 6px; flex-grow: 1;">
            <span style="width: 8px; height: 8px; background: #6b5a72;"></span>
            <span style="width: 8px; height: 8px; background: #f0c060;"></span>
          </div>
          <a href="Draconia.dc.html" class="step" style="display: block; background: #5a2f0c; padding: 3px; text-decoration: none;">
            <span class="step" style="display: block; padding: 11px 26px; background: linear-gradient(#ffe08a 0 5px, #e8ac36 5px); box-shadow: inset 0 -5px 0 #b06f1c; font-weight: 900; font-size: 16px; color: #3a1d06;">To the city</span>
          </a>
        </div>
      </div>
    </div>
    <!-- name tag with the speaker's sigil -->
    <div class="step" style="position: absolute; left: 160px; top: -16px; background: #12090f; padding: 3px; z-index: 3;">
      <div class="step" style="display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; background: linear-gradient(#a8401e, #6e2412); box-shadow: inset 0 2px 0 #f0a060;">
        <span aria-hidden="true" style="width: 10px; height: 10px; background: #ffd97a; transform: rotate(45deg); box-shadow: 0 0 0 2px #12090f;"></span>
        <span class="ol1" style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 15px; letter-spacing: 1px; color: #fff0d0;">ELDER PYRETH</span>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
